<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChronoSelf — i tuoi futuri possibili</title>
  <meta name="description" content="Simula chi diventi tra 1, 5 e 10 anni a partire dalle abitudini di oggi." />
  <style>
    :root { --bg:#0e1014; --bg2:#161a21; --ink:#f3efe6; --muted:#9aa3b2; --line:#2a3140; --accent:#e8c07d; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Georgia,"Iowan Old Style",Palatino,serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
    button,input{font:inherit}
    .wrap{width:min(1080px,calc(100% - 32px));margin:0 auto}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0 8px}
    .brand{letter-spacing:.08em;font-size:13px;text-transform:uppercase;color:var(--accent);background:none;border:0;cursor:pointer}
    .ghost{color:var(--muted);background:none;border:0;cursor:pointer;font-size:14px}
    .hero{padding:72px 0 40px}
    h1{font-size:clamp(36px,6vw,64px);line-height:1.05;font-weight:500;max-width:16ch}
    .lede{margin-top:20px;color:var(--muted);max-width:46ch;font-size:18px}
    .cta{display:inline-block;margin-top:28px;background:var(--accent);color:#1a1408;padding:12px 18px;border-radius:999px;font-size:15px;border:0;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px 0 80px}
    .card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px}
    .card h3{font-size:18px;font-weight:500;margin-bottom:8px}
    .card p{color:var(--muted);font-size:15px}
    .step{padding:40px 0 80px}
    .q{font-size:clamp(24px,4vw,36px);max-width:22ch}
    .meta{color:var(--muted);margin:12px 0 28px;font-size:14px}
    .range{width:100%;accent-color:var(--accent)}
    .labels{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:8px}
    .row{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
    .btn{background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;cursor:pointer}
    .tabs{display:flex;gap:8px;margin:16px 0 24px;flex-wrap:wrap}
    .tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}
    .tab.on{color:#1a1408;background:var(--accent);border-color:var(--accent)}
    .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .scenario h2{font-size:20px;margin-bottom:8px}
    .scenario p{color:#d7d2c8;font-size:15px}
    .facts{list-style:none;margin:14px 0}
    .facts li{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
    .levers{margin-top:10px;color:var(--muted);padding-left:18px;font-size:14px}
    .axisbar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:13px;color:var(--muted)}
    .bar{height:6px;background:#242a36;border-radius:99px;overflow:hidden}
    .bar>span{display:block;height:100%;background:var(--accent)}
    .disclaimer{color:var(--muted);font-size:13px;margin-top:28px;max-width:70ch}
    footer{color:var(--muted);font-size:13px;padding:24px 0 48px;border-top:1px solid var(--line)}
    @media(max-width:800px){.grid,.cols{grid-template-columns:1fr}.hero{padding-top:40px}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <button class="brand" id="goHome">ChronoSelf</button>
      <button class="ghost" id="goPrivacy">Privacy</button>
    </nav>
    <div id="app"></div>
    <footer>Strumento di riflessione, non consulenza medica, finanziaria o legale. I dati restano nel tuo browser.</footer>
  </div>
  <script src="./chronoself.js"></script>
</body>
</html>
